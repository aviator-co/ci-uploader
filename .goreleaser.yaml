version: 2

project_name: aviator-ci

builds:
  - binary: aviator-ci
    dir: ./cmd/aviator-ci
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - "-s -w -X main.Version=v{{ .Version }}"

# Bare binaries, so a runner installs with one download and a checksum check.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"

changelog:
  sort: asc
